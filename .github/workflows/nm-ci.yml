name: nm-ci

# CI enxuto do NM Connect (fork de melgarafael/DeskcommCRM).
#
# Os workflows do upstream (acolhida, ci, e2e, perf, publish-image, release,
# relogio, vigia-de-colisao) ficam DESABILITADOS neste repositório via API, sem
# editar os arquivos — editar arquivo do upstream gera conflito a cada sync. Eles
# dependem de infra que não temos (executor próprio, GHCR, secrets, Supabase no
# CI) ou fazem trabalho de release do produto deles.
#
# Este workflow roda typecheck, lint, lint:channels, lint:role-rank, cercas
# estruturais e a suíte unitária (`--project produto`) em 3 partes — mesma forma
# do `verify-parte` de ci.yml — e, na parte 4, o `test:db` (Postgres efêmero +
# baseline install/update + invariantes, incluindo o isolamento RLS entre duas
# organizações) e o `test:db:update` (update.sh sobre banco COM dados). O status
# check obrigatório da `main` é o job `nm-ci-ok`.
#
# Fora daqui (de propósito, por enquanto): e2e, build de imagem, kit bash
# (test:shell).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Partes: 1 = typecheck + auditorias + unit 1/3; 2 = lint + unit 2/3;
  # 3 = cercas + unit 3/3; 4 = test:db + test:db:update. `--project produto` é o
  # `pnpm test:unit` menos as cercas, que rodam uma vez só, na parte 3.
  #
  # A parte 4 mora na MESMA matriz (e não num job novo) para continuar coberta
  # pelo agregador `nm-ci-ok` sem acrescentar job ao mapa de
  # tests/unit/gatilho-dos-jobs-de-entrega.test.ts. Teto de 30 min como o
  # `invariants-majors` do upstream (duas passadas de banco).
  verify:
    timeout-minutes: ${{ matrix.parte == 4 && 30 || 20 }}
    runs-on: ubuntu-latest
    # Concurrency por job (não por workflow): o agregador `nm-ci-ok` roda com
    # `if: always()` e, num grupo de workflow, seguraria o grupo — ver o
    # cabeçalho de ci.yml. Em PR, push novo cancela o run antigo; na main, não.
    concurrency:
      group: ${{ github.workflow }}-verify${{ matrix.parte }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    env:
      # Lida por scripts/test-db.sh e scripts/test-update-com-dados.sh. pg17 é a
      # major do Supabase Cloud onde o NM Connect vai rodar; o piso pg15 segue
      # vigiado pela cerca baseline-no-piso-do-postgres.
      TEST_DB_IMAGE: pgvector/pgvector:pg17
    steps:
      - uses: actions/checkout@v7

      # Node 22, pnpm da versão em `packageManager` (pnpm/action-setup), cache
      # pnpm e `pnpm install --frozen-lockfile`.
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - name: Typecheck
        if: matrix.parte == 1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm typecheck

      - name: Channel provider leak
        if: matrix.parte == 1
        run: pnpm lint:channels

      - name: Role rank audit
        if: matrix.parte == 1
        run: pnpm lint:role-rank

      - name: Lint
        if: matrix.parte == 2
        run: pnpm lint

      - name: Cercas estruturais
        if: matrix.parte == 3
        run: pnpm cercas

      - name: Unit tests (parte ${{ matrix.parte }}/3)
        if: matrix.parte != 4
        run: pnpm test:unit --project produto --shard=${{ matrix.parte }}/3

      # O test:db confere o update.sh do checkout contra o da ÚLTIMA RELEASE
      # PUBLICADA e o da v1.63.0 (scripts/conferir-isolamento-do-kit.sh). O
      # nm-connect não publica releases nem tem as tags do upstream: sem este
      # passo o script não acha release nenhuma e reprova. A referência vem do
      # upstream (melgarafael/DeskcommCRM), e as duas tags são buscadas de lá,
      # rasas, antes do script — que só busca no `origin` quando a tag falta.
      - name: Release de referência do upstream (para o test:db)
        if: matrix.parte == 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel="$(gh release view -R melgarafael/DeskcommCRM --json tagName -q .tagName)"
          case "$rel" in v[0-9]*) ;; *) echo "release do upstream ilegível: '$rel'" >&2; exit 1 ;; esac
          for tag in "$rel" v1.63.0; do
            git fetch -q --no-tags --depth=1 https://github.com/melgarafael/DeskcommCRM.git "+refs/tags/$tag:refs/tags/$tag"
          done
          echo "CONFERENCIA_KIT_RELEASE=$rel" >> "$GITHUB_ENV"
          echo "release de referência: $rel"

      - name: RLS isolation + governance invariants (test:db)
        if: matrix.parte == 4
        run: pnpm test:db

      - name: update.sh sobre banco COM DADOS (test:db:update)
        if: matrix.parte == 4
        run: pnpm test:db:update

  # O NOME DESTE JOB É O STATUS CHECK OBRIGATÓRIO. Sem concurrency, de
  # propósito; `skipped` e `cancelled` reprovam — parte que não rodou não mediu.
  nm-ci-ok:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Falhar se qualquer parte não passou
        env:
          VERIFY: ${{ needs.verify.result }}
        run: |
          echo "verify: ${VERIFY}"
          [ "$VERIFY" = "success" ]
